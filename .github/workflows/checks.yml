name: checks

# The repository carried a consistency-check script and nothing that ran it.
# Both suites gate here: check_spec.py keeps the documents internally
# consistent, and the conformance suite is the executable form of the
# acceptance criteria. A criterion that cannot fail a build is decoration.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Specification consistency
        run: python3 scripts/check_spec.py -v

      - name: Acceptance criteria conformance
        run: python -m pytest tests/conformance -v

      - name: Unit tests
        run: python -m pytest tests/unit -v

      - name: Verify a claim end to end
        run: |
          PYTHONPATH=. python3 cli/verify.py \
            "prices rose over the last three years due to governmental incompetence" \
            --jurisdiction ZZ --packs packs/fixture

      # Every claim shape, not the bounded sample the suite gates on. It runs
      # in seconds and it is the check that finds what the criteria cannot:
      # three defects so far were invisible to a green conformance run.
      - name: Claim-shape fuzzing
        run: python3 scripts/fuzz_shapes.py --all

      # The harvester ships with every source disabled. This asserts that the
      # shipped configuration reaches nothing at all — the run must skip and
      # exit 2 ("nothing was scanned"), never 0. A harvester that quietly
      # acquired a live default would otherwise pass every other check here.
      - name: Harvester reaches nothing by default
        run: |
          set +e
          output=$(python3 scripts/harvest_corpus.py --dry-run 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -ne 2 ]; then
            echo "expected exit 2 (nothing scanned), got $status" >&2
            exit 1
          fi
          echo "$output" | grep -q "skipped" || {
            echo "expected the disabled source to be skipped with its reason" >&2
            exit 1
          }
