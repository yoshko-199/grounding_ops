# Fixture custodian pack — a synthetic jurisdiction for the conformance suite.
#
# ZZ is not a country and its custodians are not institutions.  The pack
# exists so that every guarantee in the spec can be exercised end to end
# without populating a real jurisdiction from recollection, which is the
# failure the whole system exists to prevent and would be self-refuting to
# commit in the test rig.
#
# It carries no figures.  Series values live in the fixture custodian adapter
# and reach the engine only through recorded retrievals, exactly as a real
# custodian's would.  A pack holding its own numbers would be interface §6's
# "pack serving figures from memory" introduced by the tests.
#
# Measures are chosen to exercise the hard paths:
#   price_index            break with a linked series  -> continuity check passes
#   output_index           break with no linked series -> never Verified (AC-12)
#   assembly_seats         discrete                    -> exact match (AC-13)
#   sparse_gauge           single-observation series   -> sweep cannot run (AC-11)
#   unemployment_survey    | definitionally distinct measures published by
#   unemployment_registered| different custodians       -> Contested by definition

[header]
jurisdiction_id = "ZZ"
languages = ["en"]
authority_basis = "Fixture. No statutory basis; this jurisdiction does not exist."
pack_version = "1.0.0-fixture"
maintainer = "conformance suite"

# --------------------------------------------------------------------------
# Custodians
# --------------------------------------------------------------------------

[[custodians]]
id = "zzstat"
name = "ZZ Statistical Office"
mandate = "Fixture national statistical office; compiles price, output, and labour series."
cadence = "monthly"
revision_policy = "Publishes provisional prints and revises them at the following release."
access_method = "fixture adapter, in process"
integrity_annotation = "none known"

[[custodians]]
id = "zzelect"
name = "ZZ Electoral Commission"
mandate = "Fixture authority certifying assembly election results."
cadence = "per election"
revision_policy = "Certified results supersede provisional counts and are not revised thereafter."
access_method = "fixture adapter, in process"
integrity_annotation = "none known"

[[custodians]]
id = "zzlabour"
name = "ZZ Labour Directorate"
mandate = "Fixture administrative registry of persons registered as seeking work."
cadence = "monthly"
revision_policy = "Administrative counts are restated as late registrations arrive."
access_method = "fixture adapter, in process"
integrity_annotation = """Administrative coverage counts only those who register. \
Absence from the register is not evidence of employment, and a verified count \
must never render as a measure of joblessness."""

# --------------------------------------------------------------------------
# Measures
# --------------------------------------------------------------------------

[[measures]]
id = "price_index"
name = "ZZ Price Index"
definition = "Index of consumer prices against a fixed basket and base year."
custodian_id = "zzstat"
series_identifier = "ZZ-PRICE"
unit = "index_points"
published_precision = 0.1
discrete = false
known_confusions = [
  "Month-over-month change against year-over-year change.",
  "Nominal against real; the index is the deflator, not a deflated series.",
  "A component series is not the headline index.",
]
admissible_baselines = ["prior_period", "prior_year", "series_start", "last_break"]
admissible_windows = ["1m", "3m", "12m"]
admissible_source_ref = "ZZ Statistical Office, Fixture Release Calendar and Standard Comparisons"

  [[measures.series_breaks]]
  effective_date = 2020-01-01
  kind = "base_year"
  custodian_notice_ref = "ZZ Statistical Office, Fixture Notice on Rebasing"
  linked_series_available = true
  linked_series_identifier = "ZZ-PRICE-LINKED"

[[measures]]
id = "output_index"
name = "ZZ Output Index"
definition = "Index of manufacturing output volume."
custodian_id = "zzstat"
series_identifier = "ZZ-OUTPUT"
unit = "index_points"
published_precision = 0.1
discrete = false
known_confusions = [
  "Volume against value; the index is a volume measure and does not move with prices.",
  "Manufacturing output is not total output.",
]
admissible_baselines = ["prior_period", "prior_year"]
admissible_windows = ["3m", "12m"]
admissible_source_ref = "ZZ Statistical Office, Fixture Release Calendar and Standard Comparisons"

  # No linked series spans this break.  Any element comparing across it is
  # Contested by definition or Unverified, never Verified (§9.5, AC-12).
  [[measures.series_breaks]]
  effective_date = 2019-06-01
  kind = "methodology"
  custodian_notice_ref = "ZZ Statistical Office, Fixture Notice on Survey Redesign"
  linked_series_available = false

[[measures]]
id = "assembly_seats"
name = "ZZ Assembly seats"
definition = "Certified seat allocation following an assembly election."
custodian_id = "zzelect"
series_identifier = "ZZ-SEATS"
unit = "seats"
published_precision = 1.0
discrete = true
known_confusions = [
  "Certified allocation against exit-poll projection.",
  "Seats against vote share; the allocation is not proportional to either.",
]
admissible_baselines = ["prior_period"]
admissible_windows = ["1_election"]
admissible_source_ref = "ZZ Electoral Commission, Fixture Certification Record"

[[measures]]
id = "sparse_gauge"
name = "ZZ Sparse Gauge"
definition = """A measure the fixture custodian publishes as a single observation \
with no history. Declares admissible alternatives, but the series is too short for \
any of them to be computed."""
custodian_id = "zzstat"
series_identifier = "ZZ-SPARSE"
unit = "index_points"
published_precision = 0.1
discrete = false
known_confusions = ["none known"]
admissible_baselines = ["prior_period", "prior_year"]
admissible_windows = ["12m"]
admissible_source_ref = "ZZ Statistical Office, Fixture Release Calendar and Standard Comparisons"

[[measures]]
id = "unemployment_survey"
name = "ZZ survey unemployment rate"
definition = """Share of the labour force reporting themselves as without work and \
seeking work, measured by household survey."""
custodian_id = "zzstat"
series_identifier = "ZZ-UNEMP-SURVEY"
unit = "percent"
published_precision = 0.1
discrete = false
known_confusions = [
  "Not the registered job-seeker count. Different population, different definition.",
]
admissible_baselines = ["prior_period", "prior_year"]
admissible_windows = ["3m", "12m"]
admissible_source_ref = "ZZ Statistical Office, Fixture Release Calendar and Standard Comparisons"

[[measures]]
id = "unemployment_registered"
name = "ZZ registered job-seekers"
definition = """Count of persons registered with the Labour Directorate as seeking \
work. An administrative count of registrations, not a measure of the labour force."""
custodian_id = "zzlabour"
series_identifier = "ZZ-UNEMP-REG"
unit = "persons"
published_precision = 1.0
discrete = true
known_confusions = [
  "Not the survey unemployment rate. Quoting one as the other is the archetypal misleading-but-numerically-true claim in this fixture.",
]
admissible_baselines = ["prior_period"]
admissible_windows = ["12m"]
admissible_source_ref = "ZZ Labour Directorate, Fixture Registry Publication Schedule"

# --------------------------------------------------------------------------
# Routing rules
# --------------------------------------------------------------------------

[[routing_rules]]
measure_id = "price_index"
custodian_id = "zzstat"
rationale = "Sole compiler of the fixture price index."
no_alternative_custodian = true

[[routing_rules]]
measure_id = "output_index"
custodian_id = "zzstat"
rationale = "Sole compiler of the fixture output index."
no_alternative_custodian = true

[[routing_rules]]
measure_id = "assembly_seats"
custodian_id = "zzelect"
rationale = "Certifying authority for assembly elections; the certified record is the seat allocation."
alternatives_considered = [
  "ZZ Statistical Office publishes demographic series but certifies no election result.",
]

[[routing_rules]]
measure_id = "sparse_gauge"
custodian_id = "zzstat"
rationale = "Sole publisher of the fixture sparse gauge."
no_alternative_custodian = true

[[routing_rules]]
measure_id = "unemployment_survey"
custodian_id = "zzstat"
rationale = """The survey rate is the defined labour-force measure and is compiled \
from the household survey."""
alternatives_considered = [
  "ZZ Labour Directorate registered job-seeker count — a different population measured a different way, not an alternative source for this measure.",
]

[[routing_rules]]
measure_id = "unemployment_registered"
custodian_id = "zzlabour"
rationale = "The Directorate maintains the registry and is the originating record for registrations."
alternatives_considered = [
  "ZZ Statistical Office survey unemployment rate — measures the labour force, not the registry.",
]

# --------------------------------------------------------------------------
# Lexicons — interface §3.6
# --------------------------------------------------------------------------

[[lexicons]]
language = "en"
# A fictional demonym for a fictional jurisdiction, on the same footing as
# ZZ's fictional custodians -- here to exercise interface v1.3's names[]
# resolution path (§9.8.2 rule 1) without inventing anything about a real
# country.
names = ["Zeeland"]
composition_connectives = ["and", ", ", "; ", "then"]
forbidden_connectives = [
  "because", "because of", "due to", "caused by", "thanks to",
  "as a result of", "resulting in", "leading to", "owing to",
  "therefore", "hence", "consequently", "which shows", "which proves",
  "meaning that", "although", "despite", "even though", "however",
]
element_slot_order = ["time_period", "entity", "measure", "direction", "quantity"]
# Interface v1.5: what the reconstruction's figure is -- a level at its
# reference period, not the size of a change.
quantity_form = ", standing at {figure} in {period}"
# Real claims carry typos. A trigger missed on a misspelling under-fires
# silently, and a derived element is gated and never verified, so the cost of
# a false trigger is a reviewer's attention rather than a laundered fact.
fuzzy_trigger_matching = true

  [lexicons.derivation_triggers]
  "causal-discharge" = ["due to", "because of", "thanks to", "caused by", "owing to", "as a result of"]
  "inferential-discharge" = ["therefore", "hence", "which proves", "which shows", "consequently"]
  # Not a bare "ever": it fires on "for ever", "ever since" and "have you ever",
  # none of which ranks anything. Phrases that carry the ranking sense instead.
  "superlative-discharge" = ["highest", "lowest", "first time", "record", "ever recorded", "of all time", "worst", "best"]
  "comparative-discharge" = ["more than", "less than", "twice as", "half as", "worse than", "better than"]
  "evaluative-discharge" = ["incompetence", "failure", "success", "mismanagement", "disaster", "triumph"]
  "scope-discharge" = ["all", "every", "always", "never", "nobody", "everyone", "none"]

  [lexicons.surface_vocabulary]
  # Migrated verbatim from the hardcoded English regexes in
  # engine/verification/patterns.py (interface v1.4). "by 20XX" is dropped
  # deliberately: it needed a digit wildcard the vocabulary format does not
  # support, and no test exercised it -- see docs/plan.md §2.5 for the note.
  rise = [
    "rose", "rise", "risen", "rising", "rises", "increased", "increases",
    "increasing", "grew", "grown", "grows", "climbed", "climbs", "doubled",
    "tripled", "surged", "surges", "up", "higher",
  ]
  fall = [
    "fell", "fall", "fallen", "falling", "falls", "decreased", "decreases",
    "decreasing", "dropped", "drops", "declined", "declines", "halved",
    "shrank", "shrunk", "plunged", "plunges", "down", "lower",
  ]
  prediction = [
    "will", "shall", "going to", "expected to", "forecast to",
    "forecasted to", "next year", "next month", "next quarter", "projected",
  ]

  [lexicons.unit_phrases]
  # Interface v1.6. Unit id (a measure's `unit`) -> the phrases naming it in
  # English. A phrase after a numeral joins the quantity element, and a figure
  # stated in a unit other than its measure's is not compared. The ones no
  # fixture measure uses are here so that their figures are recognised as
  # stated in another unit rather than read as bare numbers.
  percent = ["percent", "per cent", "%"]
  percentage_points = ["percentage points", "percentage point"]
  index_points = ["index points"]
  seats = ["seats"]
  persons = ["persons", "people"]

  [lexicons.unit_prefixes]
  # Interface v1.7. Unit id -> the phrases written *before* a numeral: "£5",
  # "USD 5". No fixture measure is published in a currency; they are declared
  # so that a figure given in one is recognised as such and not compared,
  # instead of being read as a bare number against whatever measure binds.
  pounds_sterling = ["£", "GBP"]
  us_dollars = ["$", "US$", "USD"]
  euros = ["€", "EUR"]
