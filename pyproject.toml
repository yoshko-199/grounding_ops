[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grounding-ops"
version = "0.5.0"
description = "Claim Verification & Reconstruction Engine — implementation of docs/spec/claim-verification-engine.v0.5.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

# Console scripts for the four trial-facing commands only. Deliberately not
# scripts/*.py: harvest_corpus.py, check_spec.py and fuzz_shapes.py are
# development tooling that already locates the repository root itself
# (harvest_corpus.py's own docstring: "needs no PYTHONPATH"), and turning
# them into installed entry points would mean giving up that self-location
# for a use case — a trial analyst verifying claims — that never calls them.
[project.scripts]
grounding-verify = "cli.verify:main"
grounding-show = "cli.show:main"
grounding-signoff = "cli.signoff:main"
grounding-serve = "cli.serve:main"

[tool.setuptools.packages.find]
# Only what the installed commands import. `plugins` is deliberately absent:
# `plugins.harvest` is the one network-capable package in the tree, the three
# console scripts never import it, and an install that carries it puts code
# that may reach the network into an environment that has no use for it. The
# development tooling that does use it (`scripts/fuzz_shapes.py`,
# `scripts/harvest_corpus.py`) runs from a checkout and puts the repository
# root on `sys.path` itself, so nothing needs it installed.
include = ["engine*", "cli*"]
# tests/ carries __init__.py at every level (so pytest can import fixtures
# across directories) and would otherwise be discovered as installable
# packages by the default "*" include pattern.
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
